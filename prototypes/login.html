<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log in - Riverside Community Garden admin</title>
    <link rel="stylesheet" href="mockup.css" />
    <style>
      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: var(--space-5) var(--space-4);
      }
      .login {
        width: 100%;
        max-width: calc(var(--sidebar-width) * 1.7);
      }
      .login-brand {
        display: grid;
        justify-items: center;
        gap: var(--space-3);
        margin-bottom: var(--space-5);
        text-align: center;
      }
      .login-brand h1 {
        font-size: var(--text-xl);
        font-weight: var(--weight-semibold);
        line-height: var(--leading-tight);
      }
      .login-brand p {
        color: var(--color-text-muted);
        font-size: var(--text-sm);
      }
      .card {
        display: grid;
        gap: var(--space-4);
        padding: var(--space-5);
        border: var(--border-width) solid var(--color-border);
        border-radius: var(--radius-lg);
        background: var(--color-surface);
        box-shadow: var(--shadow-sm);
      }
      .login-help {
        margin-top: var(--space-4);
        color: var(--color-text-muted);
        font-size: var(--text-sm);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main class="login">
      <div class="login-brand">
        <svg class="logo-mark" viewBox="0 0 32 32" width="32" height="32" aria-hidden="true">
          <rect width="32" height="32" rx="8" style="fill: var(--color-success)" />
          <path d="M16 25V13m0 0c0-4 3-6 7-6 0 4-3 6-7 6Zm0 4c0-3-2-5-6-5 0 3 2 5 6 5Z" style="fill: none; stroke: var(--color-surface); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round" />
        </svg>
        <h1>Log in to Riverside Community Garden</h1>
        <p>Manage the website’s posts, pages and images.</p>
      </div>

      <form class="card" method="post" action="#" novalidate>
        <div class="message message-error" role="alert">
          <svg class="message-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M12 7v6M12 16.5v.5" /></svg>
          <p class="message-body"><strong>That email and password don’t match.</strong> Check them and try again.</p>
        </div>

        <div class="field">
          <label class="field-label" for="email">Email</label>
          <input class="input" id="email" name="email" type="email" autocomplete="username" value="jonas.weber@example.org" />
        </div>

        <div class="field">
          <label class="field-label" for="password">Password</label>
          <input class="input" id="password" name="password" type="password" autocomplete="current-password" />
        </div>

        <button class="button button-primary button-block" type="submit">Log in</button>
      </form>

      <p class="login-help">Forgot your password? Ask an admin of this site to reset it.</p>
    </main>

    <fieldset class="preview-switch">
      <legend>Preview</legend>
      <label><input type="radio" name="preview" id="preview-system" checked /> System</label>
      <label><input type="radio" name="preview" id="preview-light" /> Light</label>
      <label><input type="radio" name="preview" id="preview-dark" /> Dark</label>
    </fieldset>
  </body>
</html>
