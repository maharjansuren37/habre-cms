name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify (typecheck, lint, unit tests, build)
    # Same Ubuntu release as the production VPS.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Actions pinned to commit SHAs - a moved tag cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 26 as recorded in AGENTS.md; React Router 8 needs >= 22.22.
          node-version: "26"
          cache: npm

      - name: Install from lockfile
        run: npm ci --no-audit --no-fund

      - name: Verify
        run: npm run verify
