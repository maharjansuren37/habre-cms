# systemd drop-in for caddy.service, installed by deploy/setup-server.sh as
# /etc/systemd/system/caddy.service.d/habre-cms.conf. It adds one line and never
# replaces Caddy's own unit: Caddy's environment gets the two domains and the
# Cloudflare token that deploy/caddy/habre-cms.caddy reads (item 16b).
[Service]
EnvironmentFile=/etc/caddy/habre-cms.env
